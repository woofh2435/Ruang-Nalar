# Bab 1: Sosiologi Itu Apa, Sih?

Jam istirahat di kantin kampus. Tidak ada yang memberi aba-aba, tapi antrean terbentuk dengan sendirinya: orang berdiri berurutan, yang menyerobot dilirik tajam, dan semua paham bahwa tas di atas kursi berarti "sudah ada yang punya". Tidak ada pasal yang menuliskannya, tapi hampir semua orang mematuhinya.

Pertanyaan "kenapa semua orang berperilaku begitu?" adalah pertanyaan sosiologi.

## Masyarakat sebagai Bahan Penelitian

**Sosiologi** adalah ilmu yang mempelajari masyarakat: bagaimana manusia hidup bersama, saling memengaruhi, membentuk kelompok dan aturan, lalu berubah dari waktu ke waktu. Kalau [[psikologi|ilmu yang berfokus pada pikiran dan perilaku individu]] bertanya "apa yang terjadi di kepala satu orang?", sosiologi bertanya "pola apa yang muncul ketika banyak orang hidup bersama?".

Aturan tak tertulis di kantin tadi disebut [[norma sosial|aturan tidak tertulis tentang perilaku yang pantas dalam sebuah kelompok]]. Norma tidak dipelajari dari buku peraturan, melainkan dari pengalaman sehari-hari: dari keluarga, teman, sekolah, dan media.

## Masalah Pribadi atau Isu Publik?

Bayangkan satu lulusan sulit mendapat pekerjaan. Orang mudah menyimpulkan, "dia kurang berusaha". Tapi kalau ribuan lulusan di kota yang sama mengalami hal serupa, penjelasannya tidak lagi cukup berhenti pada satu orang. Kita perlu melihat lapangan kerja, upah, dan kebijakan di sekelilingnya.

Kemampuan menghubungkan pengalaman pribadi dengan kekuatan sosial yang lebih besar ini disebut [[imajinasi sosiologis|cara berpikir yang menempatkan hidup seseorang di dalam sejarah dan struktur masyarakatnya]], gagasan sosiolog Amerika C. Wright Mills dalam bukunya *The Sociological Imagination* (1959).

:::catatan tipe=tips
Cara cepat melatihnya: setiap kali menemui masalah yang terasa "cuma aku yang begini", tanyakan, "siapa lagi yang mengalami hal ini, dan apa yang sama dari keadaan kami?"
:::

Belakang: Aturan, tertulis maupun tidak, tentang perilaku yang dianggap pantas dalam sebuah kelompok.
:::

Depan: Imajinasi sosiologis
Belakang: Kemampuan melihat kaitan antara masalah pribadi dan kekuatan masyarakat yang lebih besar.
:::

## Sosok di Baliknya

:::tokoh nama="Auguste Comte" tahun="1798–1857"
Filsuf Prancis yang memakai istilah "sosiologi" pada 1838. Ia bercita-cita menjadikan studi masyarakat seilmiah ilmu alam.
:::

:::tokoh nama="C. Wright Mills" tahun="1916–1962"
Sosiolog Amerika penulis *The Sociological Imagination* (1959), pencetus gagasan imajinasi sosiologis.
:::

## Kuis Kilat

:::kuis
Q: Antrean di kantin terbentuk tanpa ada yang memberi aba-aba. Dalam sosiologi, aturan tak tertulis seperti ini disebut...
- Hukum pidana
- [x] Norma sosial
- Kebetulan semata
- Strategi pemasaran
Penjelasan: Norma sosial adalah aturan tidak tertulis tentang perilaku yang pantas, dipelajari lewat pengalaman bersama orang lain.
:::

:::kuis
Q: Ribuan lulusan di satu kota sama-sama sulit mendapat kerja. Cara berpikir sosiologis paling tepat membacanya sebagai...
- Bukti bahwa semua lulusannya malas
- Kebetulan yang tidak perlu diteliti
- [x] Isu bersama yang punya sebab sosial, seperti lapangan kerja dan kebijakan
- Masalah pribadi yang sama persis pada setiap orang
Penjelasan: Pola yang menimpa banyak orang sekaligus menunjuk pada faktor di luar diri individu.
:::

## Jeda Refleksi

:::refleksi
Pilih satu kebiasaan di sekitarmu, misalnya cara orang antre, cara menyapa dosen, atau jam tidur anak kos. Tulis: aturan tak tertulis apa yang ada di baliknya, dan dari siapa kamu mempelajarinya?
:::

# Bab 2: Tiga Kacamata Membaca Masyarakat

Menjelang tahun ajaran baru, harga kos di sekitar kampus naik. Satu kejadian, tapi bisa dijelaskan dengan cara yang sangat berbeda tergantung kacamata yang dipakai. Sosiologi punya tiga kacamata besar yang sampai sekarang masih menjadi dasar belajar di banyak kampus.

## Kacamata Pertama: Fungsionalisme

[[Fungsionalisme struktural|cara pandang yang melihat masyarakat seperti tubuh: tiap bagian punya fungsi yang menjaga keseimbangan keseluruhan]] bertanya, "apa gunanya pola ini bagi masyarakat?". Dari sini, harga kos mengikuti kebutuhan: kampus ramai, permintaan naik, pemilik menyiapkan lebih banyak kamar. Tokohnya, Emile Durkheim, menekankan bahwa masyarakat punya aturan dan nilai bersama yang mengikat perilaku individu.

## Kacamata Kedua: Teori Konflik

[[Teori konflik|cara pandang yang menyoroti perebutan sumber daya dan kekuasaan di masyarakat]] bertanya, "siapa yang diuntungkan dan siapa yang dirugikan?". Kenaikan harga kos menguntungkan pemilik, tapi memberatkan mahasiswa baru dari keluarga berpenghasilan terbatas. Karl Marx memulai tradisi ini lewat pembahasannya tentang pertentangan kelas, yang kini berkembang untuk membedah ketimpangan gender, pendidikan, dan lainnya.

## Kacamata Ketiga: Interaksionisme Simbolik

[[Interaksionisme simbolik|cara pandang yang meneliti makna yang dipertukarkan orang lewat simbol, bahasa, dan interaksi sehari-hari]] bertanya, "apa arti peristiwa ini bagi orang yang mengalaminya?". Bagi sebagian penghuni, kos yang mahal berarti gengsi dan rasa aman; bagi yang lain, berarti beban. Makna itu terbentuk lewat obrolan, perbandingan, dan cerita sesama anak kos.

:::catatan tipe=penting
Tidak ada kacamata yang paling benar. Sosiolog sering memakai ketiganya bergantian, tergantung pertanyaan yang ingin dijawab.
:::

## Kamus Kilat

:::kartu
Depan: Fungsionalisme struktural
Belakang: Masyarakat dipandang seperti tubuh, tiap bagiannya berfungsi menjaga keseimbangan.
:::

:::kartu
Depan: Teori konflik
Belakang: Masyarakat dilihat lewat perebutan sumber daya dan kekuasaan antarkelompok.
:::

:::kartu
Depan: Interaksionisme simbolik
Belakang: Masyarakat dipahami lewat makna yang dibentuk orang dalam interaksi sehari-hari.
:::

## Sosok di Baliknya

:::tokoh nama="Émile Durkheim" tahun="1858–1917"
Sosiolog Prancis, tokoh fungsionalisme struktural. Ia menekankan bahwa aturan dan nilai bersama di masyarakat mengikat perilaku individu.
:::

:::tokoh nama="Karl Marx" tahun="1818–1883"
Pemikir Jerman yang melihat sejarah masyarakat digerakkan oleh pertentangan kelas. Gagasannya menjadi dasar teori konflik.
:::

:::tokoh nama="George Herbert Mead" tahun="1863–1931"
Filsuf dan sosiolog Amerika yang menjelaskan bagaimana "diri" seseorang terbentuk lewat interaksi dengan orang lain. Muridnya, Herbert Blumer, kemudian memberi nama interaksionisme simbolik.
:::

## Kuis Kilat

:::kuis
Q: Pertanyaan "siapa yang diuntungkan dan siapa yang dirugikan?" paling dekat dengan kacamata...
- Fungsionalisme struktural
- [x] Teori konflik
- Interaksionisme simbolik
- Tidak ada, itu bukan pertanyaan sosiologi
Penjelasan: Teori konflik fokus pada perebutan sumber daya dan kekuasaan, jadi pertanyaan utamanya soal untung dan rugi tiap kelompok.
:::

:::kuis
Q: Siapa yang dianggap peletak dasar interaksionisme simbolik?
- Karl Marx
- Émile Durkheim
- [x] George Herbert Mead
- Auguste Comte
Penjelasan: Mead meletakkan dasarnya, sedangkan istilah "interaksionisme simbolik" diperkenalkan oleh muridnya, Herbert Blumer.
:::

## Jeda Refleksi

:::refleksi
Pilih satu hal yang sedang ramai di sekitarmu, misalnya grup WhatsApp angkatan yang penuh tugas atau tren kopi kekinian. Jelaskan dengan dua dari tiga kacamata. Perhatikan bagaimana jawabanmu berubah tergantung kacamata yang dipakai.
:::

# Bab 3: Sosiologi di Kehidupan Nyata

Sosiologi bukan cuma teori di ruang kuliah. Ia dipakai setiap kali seseorang perlu memahami kenapa sekelompok orang berperilaku tertentu, lalu mengambil keputusan berdasarkan pemahaman itu.

## Cara Sosiolog Mencari Tahu

Sosiolog tidak menebak-nebak. Mereka mengumpulkan data dengan beberapa cara:

- **Survei**: menanyai banyak orang dengan pertanyaan yang sama untuk melihat pola secara luas.
- **Wawancara mendalam**: berbincang panjang dengan sedikit orang untuk memahami pengalaman dan makna di baliknya.
- **Observasi**: mengamati langsung bagaimana orang berperilaku di tempat sebenarnya.

Tiap cara punya kelebihan. Survei memberi gambaran luas, wawancara dan observasi memberi kedalaman. Penelitian yang baik sering memadukan keduanya.

## Setelah Belajar Sosiologi, Mau Ke Mana?

Kemampuan membaca pola sosial, mengolah data, dan menjelaskannya dengan jernih dibutuhkan di banyak tempat. Lulusan sosiologi bisa ditemui di lembaga riset dan survei, instansi pemerintah yang menyusun kebijakan, program pemberdayaan masyarakat di perusahaan atau LSM, bagian sumber daya manusia, tim riset pengguna di perusahaan teknologi, sampai media dan penulisan berbasis data.

Di Indonesia, sosiologi juga punya tradisi sendiri. Sosiolog Selo Soemardjan, misalnya, dikenal lewat penelitiannya tentang perubahan sosial di Yogyakarta dan dianggap salah satu perintis sosiologi di tanah air.

## Kamus Kilat

:::kartu
Depan: Survei
Belakang: Pengumpulan data dari banyak responden lewat pertanyaan yang seragam.
:::

:::kartu
Depan: Wawancara mendalam
Belakang: Percakapan panjang dengan sedikit orang untuk menggali pengalaman dan makna.
:::

:::kartu
Depan: Observasi
Belakang: Pengamatan langsung terhadap perilaku orang di tempat kejadian.
:::

## Sosok di Baliknya

:::tokoh nama="Selo Soemardjan" tahun="1915–2003"
Sosiolog Indonesia yang dikenal lewat penelitian perubahan sosial di Yogyakarta dan dianggap salah satu perintis sosiologi di Indonesia.
:::

## Kuis Kilat

:::kuis
Q: Kamu ingin memahami bagaimana pengemudi ojek online memaknai sistem poin dan rating di aplikasinya. Cara yang paling cocok untuk menggali maknanya secara mendalam adalah...
- Menyebar survei satu pertanyaan ke seribu orang acak
- [x] Wawancara mendalam dengan beberapa pengemudi
- Menebak dari berita viral
- Menghitung jumlah aplikasi di ponsel
Penjelasan: Untuk memahami makna dan pengalaman, wawancara mendalam lebih tepat daripada survei yang luas tapi dangkal.
:::

:::kuis
Q: Kenapa lulusan sosiologi punya pilihan karier yang beragam?
- Karena kurikulumnya paling ringan
- Karena semua lulusannya menjadi dosen
- [x] Karena kemampuan intinya, membaca pola sosial dan mengolah data, dibutuhkan di banyak bidang
- Karena tidak ada ujian sama sekali
Penjelasan: Keterampilan membaca pola, meneliti, dan menjelaskan hasilnya berguna lintas sektor.
:::

## Jeda Refleksi

:::refleksi
Dari bidang-bidang di atas, mana yang paling bikin kamu penasaran? Tuliskan satu pertanyaan sosial di sekitarmu yang ingin kamu teliti, lalu pilih cara mencari tahunya: survei, wawancara, atau observasi.
:::
