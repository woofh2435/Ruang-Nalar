# Bab 1: Sosiologi Itu Apa, Sih?

Jam istirahat di kantin kampus. Tidak ada yang memberi aba-aba, tapi antrean terbentuk dengan sendirinya: orang berdiri berurutan, yang menyerobot dilirik tajam, dan semua paham bahwa tas di atas kursi berarti "sudah ada yang punya". Tidak ada pasal yang menuliskannya, tapi hampir semua orang mematuhinya.

Pertanyaan "kenapa semua orang berperilaku begitu?" adalah pertanyaan sosiologi.

## Masyarakat sebagai Bahan Penelitian

**Sosiologi** adalah ilmu yang mempelajari masyarakat: bagaimana manusia hidup bersama, saling memengaruhi, membentuk kelompok dan aturan, lalu berubah dari waktu ke waktu. Kalau [[psikologi|ilmu yang berfokus pada pikiran dan perilaku individu]] bertanya "apa yang terjadi di kepala satu orang?", sosiologi bertanya "pola apa yang muncul ketika banyak orang hidup bersama?".

Aturan tak tertulis di kantin tadi disebut [[norma sosial|aturan tidak tertulis tentang perilaku yang pantas dalam sebuah kelompok]]. Norma tidak dipelajari dari buku peraturan, melainkan dari pengalaman sehari-hari: dari keluarga, teman, sekolah, dan media.

## Masalah Pribadi atau Isu Publik?

Bayangkan satu lulusan sulit mendapat pekerjaan. Orang mudah menyimpulkan, "dia kurang berusaha". Tapi kalau ribuan lulusan di kota yang sama mengalami hal serupa, penjelasannya tidak lagi cukup berhenti pada satu orang. Kita perlu melihat lapangan kerja, upah, dan kebijakan di sekelilingnya.

Kemampuan menghubungkan pengalaman pribadi dengan kekuatan sosial yang lebih besar ini disebut [[imajinasi sosiologis|cara berpikir yang menempatkan hidup seseorang di dalam sejarah dan struktur masyarakatnya]], gagasan sosiolog Amerika C. Wright Mills dalam bukunya *The Sociological Imagination* (1959).

:::catatan tipe=tips
Cara cepat melatihnya: setiap kali menemui masalah yang terasa "cuma aku yang begini", tanyakan, "siapa lagi yang mengalami hal ini, dan apa yang sama dari keadaan kami?"
:::

## Kamus Kilat

:::kartu
Depan: Masyarakat
Belakang: Sekumpulan orang yang hidup bersama cukup lama, saling berinteraksi, dan terikat aturan bersama.
:::

:::kartu
Depan: Norma sosial
Belakang: Aturan, tertulis maupun tidak, tentang perilaku yang dianggap pantas dalam sebuah kelompok.
:::

:::kartu
Depan: Imajinasi sosiologis
Belakang: Kemampuan melihat kaitan antara masalah pribadi dan kekuatan masyarakat yang lebih besar.
:::

## Sosok di Baliknya

:::tokoh nama="Auguste Comte" tahun="1798–1857"
Filsuf Prancis yang memakai istilah "sosiologi" pada 1838. Ia bercita-cita menjadikan studi masyarakat seilmiah ilmu alam.
:::

:::tokoh nama="C. Wright Mills" tahun="1916–1962"
Sosiolog Amerika penulis *The Sociological Imagination* (1959), pencetus gagasan imajinasi sosiologis.
:::

## Kuis Kilat

:::kuis
Q: Antrean di kantin terbentuk tanpa ada yang memberi aba-aba. Dalam sosiologi, aturan tak tertulis seperti ini disebut...
- Hukum pidana
- [x] Norma sosial
- Kebetulan semata
- Strategi pemasaran
Penjelasan: Norma sosial adalah aturan tidak tertulis tentang perilaku yang pantas, dipelajari lewat pengalaman bersama orang lain.
:::

:::kuis
Q: Ribuan lulusan di satu kota sama-sama sulit mendapat kerja. Cara berpikir sosiologis paling tepat membacanya sebagai...
- Bukti bahwa semua lulusannya malas
- Kebetulan yang tidak perlu diteliti
- [x] Isu bersama yang punya sebab sosial, seperti lapangan kerja dan kebijakan
- Masalah pribadi yang sama persis pada setiap orang
Penjelasan: Pola yang menimpa banyak orang sekaligus menunjuk pada faktor di luar diri individu.
:::

## Jeda Refleksi

:::refleksi
Pilih satu kebiasaan di sekitarmu, misalnya cara orang antre, cara menyapa dosen, atau jam tidur anak kos. Tulis: aturan tak tertulis apa yang ada di baliknya, dan dari siapa kamu mempelajarinya?
:::

# Bab 2: Tiga Kacamata Membaca Masyarakat

Menjelang tahun ajaran baru, harga kos di sekitar kampus naik. Satu kejadian, tapi bisa dijelaskan dengan cara yang sangat berbeda tergantung kacamata yang dipakai. Sosiologi punya tiga kacamata besar yang sampai sekarang masih menjadi dasar belajar di banyak kampus.

## Kacamata Pertama: Fungsionalisme

[[Fungsionalisme struktural|cara pandang yang melihat masyarakat seperti tubuh: tiap bagian punya fungsi yang menjaga keseimbangan keseluruhan]] bertanya, "apa gunanya pola ini bagi masyarakat?". Dari sini, harga kos mengikuti kebutuhan: kampus ramai, permintaan naik, pemilik menyiapkan lebih banyak kamar. Tokohnya, Emile Durkheim, menekankan bahwa masyarakat punya aturan dan nilai bersama yang mengikat perilaku individu.

## Kacamata Kedua: Teori Konflik

[[Teori konflik|cara pandang yang menyoroti perebutan sumber daya dan kekuasaan di masyarakat]] bertanya, "siapa yang diuntungkan dan siapa yang dirugikan?". Kenaikan harga kos menguntungkan pemilik, tapi memberatkan mahasiswa baru dari keluarga berpenghasilan terbatas. Karl Marx memulai tradisi ini lewat pembahasannya tentang pertentangan kelas, yang kini berkembang untuk membedah ketimpangan gender, pendidikan, dan lainnya.

## Kacamata Ketiga: Interaksionisme Simbolik

[[Interaksionisme simbolik|cara pandang yang meneliti makna yang dipertukarkan orang lewat simbol, bahasa, dan interaksi sehari-hari]] bertanya, "apa arti peristiwa ini bagi orang yang mengalaminya?". Bagi sebagian penghuni, kos yang mahal berarti gengsi dan rasa aman; bagi yang lain, berarti beban. Makna itu terbentuk lewat obrolan, perbandingan, dan cerita sesama anak kos.

:::catatan tipe=penting
Tidak ada kacamata yang paling benar. Sosiolog sering memakai ketiganya bergantian, tergantung pertanyaan yang ingin dijawab.
:::

## Kamus Kilat

:::kartu
Depan: Fungsionalisme struktural
Belakang: Masyarakat dipandang seperti tubuh, tiap bagiannya berfungsi menjaga keseimbangan.
:::

:::kartu
Depan: Teori konflik
Belakang: Masyarakat dilihat lewat perebutan sumber daya dan kekuasaan antarkelompok.
:::

:::kartu
Depan: Interaksionisme simbolik
Belakang: Masyarakat dipahami lewat makna yang dibentuk orang dalam interaksi sehari-hari.
:::

## Sosok di Baliknya

:::tokoh nama="Émile Durkheim" tahun="1858–1917"
Sosiolog Prancis, tokoh fungsionalisme struktural. Ia menekankan bahwa aturan dan nilai bersama di masyarakat mengikat perilaku individu.
:::

:::tokoh nama="Karl Marx" tahun="1818–1883"
Pemikir Jerman yang melihat sejarah masyarakat digerakkan oleh pertentangan kelas. Gagasannya menjadi dasar teori konflik.
:::

:::tokoh nama="George Herbert Mead" tahun="1863–1931"
Filsuf dan sosiolog Amerika yang menjelaskan bagaimana "diri" seseorang terbentuk lewat interaksi dengan orang lain. Muridnya, Herbert Blumer, kemudian memberi nama interaksionisme simbolik.
:::

## Kuis Kilat

:::kuis
Q: Pertanyaan "siapa yang diuntungkan dan siapa yang dirugikan?" paling dekat dengan kacamata...
- Fungsionalisme struktural
- [x] Teori konflik
- Interaksionisme simbolik
- Tidak ada, itu bukan pertanyaan sosiologi
Penjelasan: Teori konflik fokus pada perebutan sumber daya dan kekuasaan, jadi pertanyaan utamanya soal untung dan rugi tiap kelompok.
:::

:::kuis
Q: Siapa yang dianggap peletak dasar interaksionisme simbolik?
- Karl Marx
- Émile Durkheim
- [x] George Herbert Mead
- Auguste Comte
Penjelasan: Mead meletakkan dasarnya, sedangkan istilah "interaksionisme simbolik" diperkenalkan oleh muridnya, Herbert Blumer.
:::

## Jeda Refleksi

:::refleksi
Pilih satu hal yang sedang ramai di sekitarmu, misalnya grup WhatsApp angkatan yang penuh tugas atau tren kopi kekinian. Jelaskan dengan dua dari tiga kacamata. Perhatikan bagaimana jawabanmu berubah tergantung kacamata yang dipakai.
:::

# Bab 3: Sosiologi di Kehidupan Nyata

Sosiologi bukan cuma teori di ruang kuliah. Ia dipakai setiap kali seseorang perlu memahami kenapa sekelompok orang berperilaku tertentu, lalu mengambil keputusan berdasarkan pemahaman itu.

## Cara Sosiolog Mencari Tahu

Sosiolog tidak menebak-nebak. Mereka mengumpulkan data dengan beberapa cara:

- **Survei**: menanyai banyak orang dengan pertanyaan yang sama untuk melihat pola secara luas.
- **Wawancara mendalam**: berbincang panjang dengan sedikit orang untuk memahami pengalaman dan makna di baliknya.
- **Observasi**: mengamati langsung bagaimana orang berperilaku di tempat sebenarnya.

Tiap cara punya kelebihan. Survei memberi gambaran luas, wawancara dan observasi memberi kedalaman. Penelitian yang baik sering memadukan keduanya.

## Setelah Belajar Sosiologi, Mau Ke Mana?

Kemampuan membaca pola sosial, mengolah data, dan menjelaskannya dengan jernih dibutuhkan di banyak tempat. Lulusan sosiologi bisa ditemui di lembaga riset dan survei, instansi pemerintah yang menyusun kebijakan, program pemberdayaan masyarakat di perusahaan atau LSM, bagian sumber daya manusia, tim riset pengguna di perusahaan teknologi, sampai media dan penulisan berbasis data.

Di Indonesia, sosiologi juga punya tradisi sendiri. Sosiolog Selo Soemardjan, misalnya, dikenal lewat penelitiannya tentang perubahan sosial di Yogyakarta dan dianggap salah satu perintis sosiologi di tanah air.

## Kamus Kilat

:::kartu
Depan: Survei
Belakang: Pengumpulan data dari banyak responden lewat pertanyaan yang seragam.
:::

:::kartu
Depan: Wawancara mendalam
Belakang: Percakapan panjang dengan sedikit orang untuk menggali pengalaman dan makna.
:::

:::kartu
Depan: Observasi
Belakang: Pengamatan langsung terhadap perilaku orang di tempat kejadian.
:::

## Sosok di Baliknya

:::tokoh nama="Selo Soemardjan" tahun="1915–2003"
Sosiolog Indonesia yang dikenal lewat penelitian perubahan sosial di Yogyakarta dan dianggap salah satu perintis sosiologi di Indonesia.
:::

## Kuis Kilat

:::kuis
Q: Kamu ingin memahami bagaimana pengemudi ojek online memaknai sistem poin dan rating di aplikasinya. Cara yang paling cocok untuk menggali maknanya secara mendalam adalah...
- Menyebar survei satu pertanyaan ke seribu orang acak
- [x] Wawancara mendalam dengan beberapa pengemudi
- Menebak dari berita viral
- Menghitung jumlah aplikasi di ponsel
Penjelasan: Untuk memahami makna dan pengalaman, wawancara mendalam lebih tepat daripada survei yang luas tapi dangkal.
:::

:::kuis
Q: Kenapa lulusan sosiologi punya pilihan karier yang beragam?
- Karena kurikulumnya paling ringan
- Karena semua lulusannya menjadi dosen
- [x] Karena kemampuan intinya, membaca pola sosial dan mengolah data, dibutuhkan di banyak bidang
- Karena tidak ada ujian sama sekali
Penjelasan: Keterampilan membaca pola, meneliti, dan menjelaskan hasilnya berguna lintas sektor.
:::

## Jeda Refleksi

:::refleksi
Dari bidang-bidang di atas, mana yang paling bikin kamu penasaran? Tuliskan satu pertanyaan sosial di sekitarmu yang ingin kamu teliti, lalu pilih cara mencari tahunya: survei, wawancara, atau observasi.
:::

## Langkah Berikutnya

sifat opsional; kalau kosong, halaman bayar hanya menampilkan e-wallet dan QRIS.",salin:[{label:"Secret 1",nilai:"MIDTRANS_SERVER_KEY"},{label:"Isi secret 1",nilai:"Server Key sandbox dari Midtrans (diawali SB-Mid-server-)",bisaSalin:!1},{label:"Secret 2",nilai:"MIDTRANS_ENV"},{label:"Isi secret 2",nilai:"sandbox"},{label:"Secret 3",nilai:"SITE_URL"},{label:"Isi secret 3 (alamat web ini)",nilai:rf}]},{id:"webhook",judul:"Daftarkan alamat notifikasi di Midtrans Sandbox",isi:"Di dashboard Midtrans (mode Sandbox) buka Settings → Payment Settings dan cari kolom Payment Notification URL (dokumentasi Midtrans lama menyebutnya Settings → Configuration; di HP, buka menu ☰ dulu). Kolom lain di halaman itu tidak perlu diisi. Isi dengan alamat di bawah. Ganti ID_PROYEK dengan bagian depan Project URL Supabase-mu.",salin:[{label:"Payment Notification URL",nilai:"https://ID_PROYEK.supabase.co/functions/v1/midtrans-webhook"}]},{id:"sambung",judul:"Sambungkan web ini ke Supabase",isi:"Edit file toko-config.json di samping index.html (di GitHub, ikon pensil, lalu Commit). Isi SUPABASE_URL dengan alamat depan proyekmu saja (https://xxxx.supabase.co, tanpa /rest/v1/) dan SUPABASE_ANON_KEY dengan kunci anon / publishable saja. JANGAN memasukkan kunci service_role atau sb_secret_. Tunggu beberapa menit, lalu muat ulang halaman ini. Langkah ini tercentang sendiri kalau web sudah tersambung.",otomatisJikaMode:"nyata"},{id:"jadi-admin",judul:"Jadikan akunmu admin toko",isi:"Sebelum daftar, buka Supabase → Authentication → URL Configuration dan isi Site URL dengan alamat web ini lengkap dengan nama repo, dan tambahkan alamat yang sama di Redirect URLs, supaya tautan di email konfirmasi dan email lupa kata sandi tidak berujung “Not found” (kalau sudah terlanjur, coba langsung masuk karena emailnya biasanya sudah terverifikasi). Lalu daftar akun lewat tombol akun di web ini. Di Supabase SQL Editor jalankan perintah di bawah (ganti emailnya), kemudian muat ulang halaman atau masuk lagi. Hasil “0 rows” berarti akunmu sudah ada di daftar admin.",salin:[{label:"Perintah SQL",nilai:SI,blok:!0}]},{id:"uji-sandbox",judul:"Uji beli satu ebook contoh",isi:"Di bagian “Toko ebook berbayar” buat ebook CONTOH berharga murah (minimal Rp 1.000, isi pendek), centang Terbit. Beli dengan simulator Midtrans Sandbox. Pastikan statusnya berubah jadi Lunas di halaman Akunku dan ebook terbuka."},{id:"privasi-hukum",judul:"Pasang catatan persetujuan dan fitur hapus akun (UU PDP)",isi:"Kalau kamu menjalankan schema.sql terbaru, tabel catatan persetujuan sudah ikut terpasang. Kalau skemamu dijalankan sebelum fitur ini ada, jalankan sekali file supabase/patch/01-persetujuan.sql di SQL Editor (aman diulang). Tombol Hapus akun di halaman Akun butuh satu fungsi tambahan bernama hapus-akun: Edge Functions → Deploy a new function → Via Editor, isi dengan supabase/dashboard/hapus-akun.ts, lalu matikan Verify JWT (fungsi memeriksa tokennya sendiri). Secret SITE_URL yang sama sudah cukup. Tanpa fungsi ini, web tetap jalan dan tombolnya memberi tahu penggunanya untuk meminta hapus lewat email. Isi juga NAMA_PENGELOLA, KOTA_DOMISILI, dan KONTAK_EMAIL di toko-config.json supaya Kebijakan Privasi dan Syarat & Ketentuan memuat datamu yang benar."}]},{id:"siap",judul:"Tahap 2 · Siapkan web sebelum diperiksa",ringkas:"Midtrans memeriksa website atau katalog produkmu. Ini saran, bukan syarat tertulis dari Midtrans.",langkah:[{id:"produk-contoh",judul:"Tampilkan produk dengan harga jelas",isi:"Pastikan ebook contoh dari Tahap 1 sudah Terbit, punya judul, deskripsi, dan harga yang terlihat di rak beranda. Isi aslinya tetap disimpan dulu."},{id:"alamat-publik",judul:"Pastikan alamat web bisa dibuka siapa saja",isi:"Buka alamat web-mu dari HP lain atau jendela samaran. Siapkan juga akun media sosial atau katalog produk sebagai tautan pendukung.",salin:[{label:"Alamat web ini",nilai:rf}]}]},{id:"daftar",judul:"Tahap 3 · Daftar Midtrans produksi (usaha mikro)",ringkas:"Didaftarkan sebagai perorangan. Pembayaran yang disasar: e-wallet dan QRIS.",langkah:[{id:"dokumen",judul:"Siapkan dokumen",isi:"KTP dan NPWP pribadi. Dokumen perorangan di dokumentasi Midtrans: KTP pemilik bisnis dan NPWP, sedangkan halaman pendaftarannya menyebut paket awal (transfer bank, GoPay, QRIS) cukup KTP. Siapkan keduanya. NIB tidak tercantum sebagai syarat untuk perorangan.",tautan:[{teks:"Dokumen legalitas Midtrans",url:"https://docs.midtrans.com/docs/apa-saja-dokumen-legalitas-yang-diperlukan-untuk-registrasi-akun-midtrans"},{teks:"Pendaftaran dan aktivasi akun",url:"https://midtrans.com/passport"}]},{id:"nib",judul:"Urus NIB (opsional, disarankan)",isi:"Di oss.go.id pilih skala usaha mikro dan pelaku perseorangan. Data yang diminta antara lain NIK, NPWP pribadi, email, nomor HP, dan alamat sesuai KTP. Berguna sebagai bukti usaha, tetapi bukan syarat Midtrans untuk perorangan.",tautan:[{teks:"Buka oss.go.id",url:"https://oss.go.id"}]},{id:"ajukan",judul:"Daftar dan ajukan aktivasi akun",isi:"Verifikasi email, selesaikan banner registrasi di dashboard Midtrans, pilih jenis usaha perorangan, isi data, unggah dokumen, lalu klik Ajukan. Jangan memilih kategori usaha yang dilarang Midtrans. Cantumkan alamat web, media sosial, atau katalog produk."},{id:"tunggu",judul:"Tunggu kabar persetujuan",isi:"Kabar datang lewat email. Midtrans bisa meminta dokumen tambahan. Lama prosesnya tidak dijamin; kartu kredit/debit butuh KTP dan NPWP dan bisa memakan 14–30 hari kerja, tetapi kamu tidak memerlukannya untuk e-wallet dan QRIS."}]},{id:"produksi",judul:"Tahap 4 · Pindah ke uang sungguhan",ringkas:"Dikerjakan setelah akun produksi disetujui. Tidak perlu mengubah toko-config.json.",langkah:[{id:"metode-aktif",judul:"Aktifkan metode bayar di dashboard Production",isi:"Di dashboard Midtrans mode Production, aktifkan GoPay dan QRIS (dan ShopeePay kalau tersedia untuk akunmu). Metode yang belum aktif tidak akan muncul di halaman bayar."},{id:"kunci-produksi",judul:"Ganti secret ke kunci produksi",isi:" tersebut. Isinya ditulis mengikuti UU No. 27 Tahun 2022 tentang Pelindungan Data Pribadi, dengan bahasa yang mudah dimengerti, bukan bahasa hukum yang bikin pusing.`,ringkas:["Kamu bisa membaca ebook gratis tanpa akun dan tanpa memberi data apa pun.","Akun hanya butuh email dan kata sandi. Kami tidak minta nama lengkap, nomor HP, atau alamat.","Catatan, sorotan, dan progres bacamu tersimpan di perangkatmu sendiri, bukan di server kami.","Data kartu atau dompet digitalmu tidak pernah lewat web ini. Pembayaran ditangani Midtrans.","Kamu bisa mengunduh data, menarik persetujuan, atau menghapus akun kapan saja dari menu Akun & pengaturan."],bagian:[{id:"pengendali",judul:"1. Siapa yang mengelola data kamu",paragraf:[`${e.nama} dikelola oleh ${e.pengelola}. Dalam istilah UU PDP, ${e.pengelola} adalah Pengendali Data Pribadi, yaitu pihak yang menentukan untuk apa dan bagaimana datamu diproses.`]},{id:"data",judul:"2. Data apa yang kami kumpulkan",paragraf:["Datanya dibagi tiga kelompok supaya jelas mana yang sampai ke server dan mana yang tidak."],daftar:["Saat kamu membuat akun: alamat email dan kata sandi. Kata sandi disimpan dalam bentuk acak (hash) oleh penyedia login kami, jadi kami sendiri tidak bisa membacanya.","Saat kamu menyetujui atau menarik persetujuan: jenis persetujuan, jawabannya (ya atau tidak), versi kebijakan yang kamu baca, dan waktunya.","Saat kamu membeli ebook berbayar: ebook yang dibeli, jumlah bayar, status pembayaran, nomor pesanan (Order ID), dan waktu. Data kartu, rekening, atau dompet digital tidak kami terima atau simpan.","Data teknis yang dicatat penyedia layanan demi keamanan, misalnya alamat IP, jenis perangkat, dan waktu akses.","Data yang hanya tinggal di perangkatmu (tidak dikirim ke server kami): progres baca, sorotan, catatan, penanda, jawaban kuis, refleksi, misi, rak pribadi, favorit, serta pilihan tampilan seperti tema, ukuran huruf, dan musik latar."]},{id:"tujuan",judul:"3. Untuk apa data dipakai",paragraf:["Datamu hanya dipakai untuk hal-hal di bawah ini, dan tidak kami jual."],daftar:["Membuat dan mengamankan akunmu (login, konfirmasi email, atur ulang kata sandi).","Memproses pembelian dan membuka ebook yang sudah kamu bayar, di perangkat mana pun.","Menyimpan bukti persetujuan dan pembelian bila suatu saat dibutuhkan.","Menghubungimu soal akun atau pembelian. Email promo atau info ebook baru hanya dikirim kalau kamu mencentang pilihan itu.","Menjaga web tetap aman dari penyalahgunaan."]},{id:"dasar",judul:"4. Dasar kami memproses data",paragraf:["Dasar utamanya adalah persetujuanmu. Saat membuat akun kamu diminta mencentang persetujuan terhadap Kebijakan Privasi dan Syarat & Ketentuan. Kotaknya tidak pernah tercentang otomatis. Persetujuan untuk email promo dan analitik bersifat opsional dan dipisahkan dari persetujuan yang wajib.","Untuk pembelian, data diproses juga karena dibutuhkan untuk menjalankan transaksi yang kamu minta."]},{id:"simpan",judul:"5. Berapa lama data disimpan dan cara menghapusnya",paragraf:["Data akun, riwayat pembelian di akun, dan catatan persetujuanmu disimpan selama akunmu aktif. Kamu bisa menghapus akun sendiri lewat Dasbor → Akun & pengaturan → Privasi & persetujuan → Hapus akun saya. Setelah dihapus, data itu ikut terhapus dari database kami.","Beberapa hal tidak langsung hilang: catatan transaksi di sisi Midtrans tetap dikelola Midtrans sesuai aturannya, dan salinan cadangan milik penyedia layanan bisa menyimpan data sampai siklus cadangan berikutnya selesai.","Data di perangkatmu (progres, catatan, sorotan) tidak ikut terhapus saat akun dihapus. Kamu menghapusnya sendiri lewat pengaturan browser."]},{id:"pihak-ketiga",judul:"6. Pihak lain yang menerima datamu",paragraf:["Kami memakai beberapa layanan pihak ketiga supaya web ini bisa berjalan. Masing-masing hanya menerima data yang dibutuhkannya."],daftar:["Penyedia login dan database (Supabase): menyimpan email, hash kata sandi, pembelian, dan catatan persetujuan, serta mengirim email konfirmasi dan atur ulang kata sandi.","Payment gateway (Midtrans): menerima nomor pesanan, jumlah, nama ebook, dan emailmu untuk membuat halaman pembayaran. Pembayaran dilakukan langsung di halaman Midtrans lewat GoPay, ShopeePay, atau QRIS.","Penyedia hosting (layanan hosting situs statis): mencatat log akses teknis seperti alamat IP.","Penyedia font (Google Fonts): saat halaman dibuka, browsermu mengambil huruf dari server Google, sehingga alamat IP dan informasi browsermu terlihat oleh Google.","Analitik: saat ini web ini tidak memasang analitik atau pelacak apa pun. Kalau kelak dipasang, hanya aktif untuk pengunjung yang memberi izin analitik di banner cookie."]},{id:"hak",judul:"7. Hak kamu",paragraf:["Kamu berhak atas datamu. Sebagian besar bisa kamu lakukan sendiri tanpa menunggu siapa pun."],daftar:["Mengakses: lihat email, riwayat pembelian, dan riwayat persetujuanmu di Dasbor.","Mengunduh (ekspor): tombol Unduh data akun saya di Akun & pengaturan memberi berkas JSON berisi data akunmu di server (email, pembelian, dan riwayat persetujuan).","Mengoreksi: ganti kata sandi di Akun & pengaturan. Untuk perubahan email atau data lain, hubungi kontak di bawah.","Menarik persetujuan: matikan pilihan email promo atau analitik kapan saja di Akun & pengaturan, atau lewat tautan Pengaturan cookie di bagian bawah halaman.","Menghapus: tombol Hapus akun saya di Akun & pengaturan (bagian Privasi & persetujuan).","Berkeberatan atau bertanya: hubungi kontak di bawah. Kami berusaha menanggapi dalam 3 x 24 jam."]},{id:"cookie",judul:"8. Cookie dan penyimpanan di perangkat",paragraf:["Web ini memakai penyimpanan di browser (IndexedDB dan localStorage) untuk hal yang kamu butuhkan: tetap masuk, mengingat progres bacamu, dan pilihan tampilan. Itu masuk kategori perlu dan tidak butuh izin tambahan.","Izin analitik di banner cookie adalah pilihan terpisah. Saat ini belum ada analitik yang dipasang; pilihanmu tetap dicatat supaya kalau kelak dipakai, kami sudah tahu kamu memilih apa.","Pilihan cookie disimpan di perangkatmu sebagai pengingat saja. Bukti persetujuan sebagai pemilik akun disimpan di server dengan waktu dan versi kebijakan."]},{id:"keamanan",judul:"9. Cara kami menjaga data",paragraf:["Semua halaman dan permintaan data memakai koneksi terenkripsi (HTTPS). Kata sandi disimpan dalam bentuk hash. Aturan akses di database memastikan kamu hanya bisa membaca data milikmu sendiri, dan isi ebook berbayar hanya dikirim ke akun yang sudah membayar lunas.","Tidak ada sistem yang seratus persen kebal. Kalau suatu saat terjadi kebocoran data yang berdampak padamu, kami akan memberi tahu kamu dan pihak berwenang sesuai aturan, paling lambat 3 x 24 jam sejak kami mengetahuinya, beserta langkah yang perlu kamu ambil."]},{id:"usia",judul:"10. Usia pengguna",paragraf:["Akun ditujukan untuk pengguna berusia 18 tahun ke atas. Kalau kamu belum 18 tahun, mintalah izin orang tua atau wali sebelum membuat akun atau membeli."]},{id:"kontak",judul:"11. Kontak untuk pertanyaan privasi",paragraf:[`Pertanyaan, permintaan, atau keluhan soal data pribadimu bisa disampaikan ke ${e.pengelola}. ${t}`]},{id:"perubahan",judul:"12. Tanggal berlaku dan riwayat perubahan",paragraf:[`Kebijakan ini berlaku sejak ${Jm} (versi ${Ja}). Kalau isinya berubah, tanggal dan versinya kami perbarui di sini, dan kamu akan ditanya lagi lewat banner cookie.`,"Riwayat perubahan:"],daftar:u4.map(a=>`${a.tanggal} (versi ${a.versi}): ${a.ringkas}`)}]}}function AO(e){const t=U1(e),a=e.kota?`Pengadilan Negeri ${e.kota}`:"pengadilan yang berwenang di Indonesia sesuai domisili pengelola";return{jalur:"/syarat-ketentuan",judul:"Syarat & Ketentuan",deskripsi:`Aturan memakai ${e.nama}: layanan ebook digital, hak cipta, aturan akun, pembayaran dan refund, serta cara melapor konten bermasalah.`,pembuka:`Syarat & Ketentuan ${e.nama}. Dengan membuat akun atau membeli ebook di ${e.nama}, kamu setuju dengan aturan di halaman ini. Kami menulisnya sesingkat dan sejelas mungkin supaya mudah dipahami. Soal data pribadi, baca Kebijakan Privasi.`,ringkas:["Ebook di sini boleh kamu baca untuk dirimu sendiri, tidak boleh disebar atau dijual lagi.","Satu akun untuk satu orang. Jangan bagi-bagi login.","Ebook digital yang sudah dibuka umumnya tidak bisa dikembalikan, kecuali ada masalah yang memang tanggung jawab kami.","Ada yang salah atau melanggar hak ciptamu? Laporkan, kami tindak lanjuti."],bagian:[{id:"layanan",judul:"1. Layanan yang kami sediakan",paragraf:[`${e.nama} adalah web perpustakaan ebook digital interaktif berisi catatan kuliah Sosiologi. Ada tiga jenis akses:`],daftar:["Ebook gratis atau percobaan: bisa dibaca tanpa akun.","Ebook berbayar: dibaca setelah kamu membuat akun dan pembayaran dinyatakan lunas. Aksesnya melekat pada akunmu dan bisa dibuka di perangkat mana pun setelah masuk.","Fitur belajar seperti sorotan, catatan, kuis, dan misi tersimpan di perangkatmu sendiri."]},{id:"hak-cipta",judul:"2. Hak kekayaan intelektual",paragraf:[`Seluruh isi ebook, tulisan, ilustrasi, desain sampul, maskot Nalar, dan tampilan web adalah milik ${e.pengelola} dan dilindungi UU No. 28 Tahun 2014 tentang Hak Cipta, kecuali bagian yang jelas disebut berasal dari pihak lain.`,"Kamu mendapat lisensi pribadi, tidak eksklusif, dan tidak bisa dipindahtangankan untuk membaca ebook yang kamu beli. Kamu tidak boleh menyalin, membagikan, mengunggah ulang, menjual, menyewakan, atau menerbitkan ulang isinya, baik seluruhnya maupun sebagian besar, tanpa izin tertulis. Mengutip sebagian kecil dengan menyebut sumber untuk keperluan belajar dan karya ilmiah tetap boleh."]},{id:"akun",judul:"3. Aturan akun",paragraf:["Supaya akun tetap aman dan adil bagi semua orang:"],daftar:["Pengguna berusia 18 tahun ke atas, atau sudah mendapat izin orang tua atau wali.","Gunakan email aktif milikmu dan data yang benar.","Satu akun dipakai satu orang. Dilarang membagikan login atau menjual akses.","Jaga kerahasiaan kata sandimu. Aktivitas di akunmu menjadi tanggung jawabmu.","Kalau kami menemukan pelanggaran, misalnya akun dipakai ramai-ramai atau isi ebook disebarkan, kami bisa memberi peringatan, membatasi, atau menutup akun tanpa pengembalian dana, sesuai tingkat pelanggarannya."]},{id:"pembayaran",judul:"4. Pembayaran dan pengembalian dana (refund)",paragraf:["Harga ditampilkan dalam rupiah di halaman ebook dan berlaku sekali bayar untuk akses seterusnya. Harga yang ditagih selalu yang tercatat di server saat kamu menekan tombol beli.","Pembayaran diproses oleh Midtrans lewat GoPay, ShopeePay, atau QRIS. Ebook terbuka otomatis setelah pembayaran lunas. Kalau sudah membayar tetapi ebook belum terbuka, tunggu beberapa menit lalu tekan Periksa lagi di halaman akun. Kalau tetap belum terbuka, hubungi kami dengan menyertakan Order ID.","Karena ebook adalah produk digital yang langsung bisa dibaca, pembelian yang sudah terbuka pada dasarnya tidak bisa dikembalikan. Pengecualiannya: kamu membayar dua kali untuk ebook yang sama, ebook tidak bisa dibuka karena kesalahan dari kami, atau ada kesalahan tagihan. Dalam kasus itu kami mengembalikan dana lewat Midtrans, dan akses ebook ikut ditutup."]},{id:"tanggung-jawab",judul:"5. Batas tanggung jawab",paragraf:[`Kami berusaha menjaga web tetap bisa diakses dan isinya akurat, tetapi ebook adalah catatan belajar, bukan nasihat profesional. ${e.nama} disediakan apa adanya. Kami tidak bertanggung jawab atas gangguan di luar kendali wajar kami, misalnya gangguan internet, pemeliharaan penyedia layanan, atau kerusakan perangkatmu.`,"Karena sorotan dan catatanmu tersimpan di perangkat, kehilangan data browser berarti kehilangan data itu. Simpan cadangan kalau penting."]},{id:"hukum",judul:"6. Hukum yang berlaku dan penyelesaian sengketa",paragraf:["Syarat ini tunduk pada hukum Republik Indonesia. Kalau ada perselisihan, kita mulai dengan musyawarah. Bila tidak ada titik temu, penyelesaiannya melalui "+a+"."]},{id:"lapor",judul:"7. Melapor konten bermasalah",paragraf:[`Kalau kamu menemukan isi yang melanggar hak ciptamu, memuat kesalahan serius, atau melanggar hukum, laporkan ke ${e.pengelola}. ${t}`,"Sertakan alamat halaman atau nama ebook, bagian yang dipersoalkan, alasannya, dan cara menghubungimu. Untuk laporan hak cipta, jelaskan juga bukti bahwa kamu pemegang haknya. Kami akan meninjau dan menindaklanjuti, termasuk menurunkan konten bila laporannya terbukti."]},{id:"perubahan",judul:"8. Perubahan syarat",paragraf:[`Syarat ini berlaku sejak ${Jm} (versi ${Ja}). Kalau berubah, kami memperbarui tanggal dan versinya di sini dan meminta kamu membacanya lagi lewat banner. Riwayat perubahan sama dengan yang tercantum di Kebijakan Privasi.`]}]}}function F1(){const e=G4(),t=np();return k.useMemo(()=>({nama:zt,pengelola:e.pengelola,kota:e.kota,email:t.kontakEmail}),[e.pengelola,e.kota,t.kontakEmail])}function PO(){const e=F1(),t=k.useMemo(()=>CO(e),[e]);return o.jsx(B1,{dok:t,lain:{ke:"/syarat-ketentuan",teks:"Baca Syarat & Ketentuan"}})}function RO(){const e=F1(),t=k.useMemo(()=>AO(e),[e]);return o.jsx(B1,{dok:t,lain:{ke:"/kebijakan-privasi",teks:"Baca Kebijakan Privasi"}})}function MO(){const e=wa(),t=Wt(),[a,n]=k.useState(e),[s,r]=k.useState(0),i=k.useRef(e);i.current=e;const l=k.useRef(!0);return k.useEffect(()=>{if(l.current){l.current=!1;return}if(e.pathname===a.pathname){n(e);return}if(t.kurang){n(e),window.scrollTo(0,0);return}r(u=>u+1)},[e]),o.jsxs(o.Fragment,{children:[o.jsxs(cN,{location:a,children:[o.jsx(we,{path:"/",element:o.jsx(GI,{})}),o.jsx(we,{path:"/baca/:id",element:o.jsx(xO,{})}),o.jsx(we,{path:"/admin",element:o.jsx($I,{})}),o.jsx(we,{path:"/masuk",element:o.jsx(sO,{})}),o.jsx(we,{path:"/akun",element:o.jsx(l1,{})}),o.jsx(we,{path:"/klien",element:o.jsx(ZI,{})}),o.jsx(we,{path:"/kebijakan-privasi",element:o.jsx(PO,{})}),o.jsx(we,{path:"/syarat-ketentuan",element:o.jsx(RO,{})}),o.jsxs(we,{path:"/dasbor",element:o.jsx(H5,{}),children:[o.jsx(we,{index:!0,element:o.jsx($6,{})}),o.jsx(we,{path:"rak",element:o.jsx(D6,{})}),o.jsx(we,{path:"cari",element:o.jsx(P6,{})}),o.jsx(we,{path:"fav
